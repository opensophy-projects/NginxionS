# Closed-network ("закрытый контур") test overlay: no network has a route outside Docker.
# Used by scripts/test-airgap.sh; every phase adds scenarios to smoke.sh.

services:
  openappsec:
    environment:
      # A shorter learning window can be requested by a stack test.
      NGINXIONS_LEARNING_INTERVAL_MINUTES: ${NGINXIONS_LEARNING_INTERVAL_MINUTES:-}

  nginxions:
    environment:
      # what the backend runs during the tests of the stack (index.js writes it on SIGUSR2; scripts/test-airgap.sh
      # collects it into reports/coverage-stack, scripts/coverage-report.mjs merges it with the unit tests)
      NODE_V8_COVERAGE: /tmp/coverage-backend

  control:
    environment:
      # the same for nginxions-control (control/server.js), on a volume: its root filesystem is read-only
      NODE_V8_COVERAGE: /coverage
    volumes:
      - coverage-control:/coverage

  test-upstream:
    image: docker.io/traefik/whoami:${WHOAMI_VERSION}
    container_name: nginxions-test-upstream
    # listens on 80 without the capability NET_BIND_SERVICE, as nobody, on a read-only root (scripts/check-runtime.sh)
    user: "65534:65534"
    read_only: true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  tester:
    image: docker.io/curlimages/curl:${CURL_VERSION}
    profiles:
      - test
    # writes the cookie jar to the test-state volume
    user: "0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # a one-time job: its script is mounted
    healthcheck:
      test: ["CMD", "test", "-f", "/smoke.sh"]
    environment:
      SMOKE_GROUPS: ${SMOKE_GROUPS:-all}
    # fail loudly if the script is not mounted (a missing bind source becomes an empty directory)
    entrypoint: ["/bin/sh", "-c", 'test -f /smoke.sh || { echo "smoke.sh not mounted" >&2; exit 1; }; exec /bin/sh /smoke.sh "$$@"', "--"]
    volumes:
      # relative paths resolve from deploy/, the directory of the first compose file
      - ./test/smoke.sh:/smoke.sh:ro
      # its groups (SMOKE_GROUPS: all, or a list such as "waf crowdsec")
      - ./test/smoke:/smoke.d:ro
      # phase 5: an example of open-appsec imported through WAF -> Policy
      - ../nginxions/backend/nginxions/waf/objects/examples/example.yaml:/examples/v1beta2-example.yaml:ro
      # migration: a backup of Nginx Proxy Manager 2.16 (with WAF rules of open-appsec-npm)
      - ./test/fixtures:/fixtures:ro
      - test-state:/state
    networks:
      - edge

networks:
  edge:
    internal: true

volumes:
  test-state: {}
  coverage-control: {}
