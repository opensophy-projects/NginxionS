# Semgrep rules of NginxionS, next to the community rulesets (.github/workflows/security.yml). They keep the rules of
# CLAUDE.md and the habits of the code of NginxionS: ERROR fails the run in the code of NginxionS, WARNING is reported.
rules:
  - id: nginxions-fetch-without-timeout
    message: >-
      Local-first (CLAUDE.md): every request leaves with a timeout, an unreachable service must not hang NginxionS.
      Pass signal: AbortSignal.timeout(...).
    severity: ERROR
    languages: [javascript, typescript]
    paths:
      include: [nginxions/backend/nginxions/, deploy/]
      exclude: ["*.test.js"]
    patterns:
      - pattern-either:
          - pattern: fetch($URL)
          - pattern: fetch($URL, $OPTS)
      - pattern-not: 'fetch($URL, {..., signal: $S, ...})'
    metadata:
      category: reliability
      cwe: ["CWE-400: Uncontrolled Resource Consumption"]

  - id: nginxions-shell-command
    message: >-
      A command runs through a shell: arguments of a request could become commands. Use execFile or spawn with an
      argument list and no shell.
    severity: ERROR
    languages: [javascript, typescript]
    paths:
      include: [nginxions/backend/nginxions/, deploy/, scripts/]
    pattern-either:
      - pattern: (import("node:child_process")).exec(...)
      - pattern: (import("node:child_process")).execSync(...)
      - pattern: |
          import { exec } from "node:child_process";
          ...
          exec(...);
      - pattern: |
          import { execSync } from "node:child_process";
          ...
          execSync(...);
      - pattern: '$CP.spawn($CMD, $ARGS, {..., shell: true, ...})'
      - pattern: '$CP.execFile($CMD, $ARGS, {..., shell: true, ...})'
      - pattern: 'spawn($CMD, $ARGS, {..., shell: true, ...})'
      - pattern: 'execFile($CMD, $ARGS, {..., shell: true, ...})'
    metadata:
      category: security
      cwe: ["CWE-78: OS Command Injection"]

  - id: nginxions-dangerous-html
    message: >-
      Raw HTML in the interface: text of a request (an event, a log line, a host name) would run as script. Render it as
      text.
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      include: [nginxions/frontend/src/nginxions/]
    pattern-either:
      - pattern: '<$EL dangerouslySetInnerHTML={...} />'
      - pattern: '<$EL dangerouslySetInnerHTML={...}>...</$EL>'
      - pattern: $X.innerHTML = $Y
      - pattern: $X.outerHTML = $Y
      - pattern: $X.insertAdjacentHTML(...)
    metadata:
      category: security
      cwe: ["CWE-79: Cross-site Scripting"]

  - id: nginxions-knex-raw-interpolation
    message: >-
      SQL built from a template string. Values go in bindings (?, ??); interpolate only constants of the module
      (UPPER_CASE) or SQL fragments built from them.
    severity: WARNING
    languages: [javascript]
    paths:
      include: [nginxions/backend/nginxions/]
      exclude: ["*.test.js"]
    patterns:
      - pattern-either:
          - pattern: $K.raw(`...${$X}...`, ...)
          - pattern: $B.whereRaw(`...${$X}...`, ...)
          - pattern: $B.orderByRaw(`...${$X}...`, ...)
          - pattern: $B.havingRaw(`...${$X}...`, ...)
          - pattern: $B.joinRaw(`...${$X}...`, ...)
      - metavariable-regex:
          metavariable: $X
          # not a constant, nor a list of placeholders (list.map(() => "?").join(","))
          regex: ^(?![A-Z][A-Z0-9_]*$)(?!.*\.map\(\(\) => "\?"\)\.join)
    metadata:
      category: security
      cwe: ["CWE-89: SQL Injection"]

  - id: nginxions-tls-verification-off
    message: >-
      TLS without verification of the certificate. Allowed only as an option the administrator turns on, with a
      warning in the interface.
    severity: WARNING
    languages: [javascript]
    paths:
      include: [nginxions/backend/nginxions/]
      exclude: ["*.test.js"]
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
    metadata:
      category: security
      cwe: ["CWE-295: Improper Certificate Validation"]

  - id: nginxions-weak-random
    message: Math.random is not a secret. Use crypto.randomBytes / randomUUID / randomInt for tokens, ids and passwords.
    severity: WARNING
    languages: [javascript]
    paths:
      include: [nginxions/backend/nginxions/]
      exclude: ["*.test.js"]
    pattern: Math.random()
    metadata:
      category: security
      cwe: ["CWE-338: Weak PRNG"]

  - id: nginxions-weak-hash
    message: MD5 and SHA-1 are not for passwords, signatures or tokens (a hash of a log position or a cache key is fine).
    severity: WARNING
    languages: [javascript]
    paths:
      include: [nginxions/backend/nginxions/]
      exclude: ["*.test.js"]
    pattern-either:
      - pattern: createHash("md5")
      - pattern: createHash("sha1")
    metadata:
      category: security
      cwe: ["CWE-328: Weak Hash"]

  # ---------------------------------------------------------------- rules made of bugs found in NginxionS

  - id: nginxions-regexp-from-variable
    message: >-
      A regular expression built from a variable: a value from a request, a file or the database can carry its own
      syntax (regex injection) or backtrack without end (ReDoS). Escape the value (replace(/[.*+?^${}()|[\]\\]/g,
      "\\$&")) or compare without a regular expression; a constant of the code is fine (nosemgrep with why).
    severity: WARNING
    languages: [javascript, typescript]
    paths:
      include: [nginxions/backend/nginxions/, nginxions/frontend/src/nginxions/]
      exclude: ["*.test.js", "*.test.ts", "*.test.tsx"]
    patterns:
      - pattern-either:
          - pattern: new RegExp($X, ...)
          - pattern: RegExp($X, ...)
      - pattern-not: new RegExp("...", ...)
      - pattern-not: RegExp("...", ...)
    metadata:
      category: security
      cwe: ["CWE-1333: Inefficient Regular Expression Complexity", "CWE-625: Permissive Regular Expression"]

  - id: nginxions-log-secret
    message: >-
      A password, token, key or secret goes into a log: logs are read by more people than the secrets (the diagnostic
      archive, docker logs, the audit of the logs in CI). Log that it is set, not its value.
    severity: ERROR
    languages: [javascript, typescript]
    paths:
      include: [nginxions/backend/nginxions/]
      exclude: ["*.test.js"]
    patterns:
      - pattern-either:
          - pattern: $LOG.$M(..., $X, ...)
          - pattern: $LOG.$M(`...${$X}...`)
      - metavariable-regex:
          metavariable: $LOG
          regex: ^(logger|console|signale|log|debug)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(log|info|warn|error|debug|success|fatal|trace)$
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^[\w.]*(password|passwd|secret|token|api_?key|private_?key)$
    metadata:
      category: security
      cwe: ["CWE-532: Insertion of Sensitive Information into Log File"]

  - id: nginxions-lua-shell
    message: >-
      A shell from the Lua of nginx: nginx handles requests from the internet, a value of a request in a command is a
      remote command. Talk to the service over its socket (as nginxions_files.lua talks to clamd).
    severity: ERROR
    languages: [lua]
    paths:
      include: [nginxions/rootfs/]
    pattern-either:
      - pattern: io.popen(...)
      - pattern: os.execute(...)
    metadata:
      category: security
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]

  - id: nginxions-compose-docker-socket
    message: >-
      The socket of Docker in a service: whoever reaches the container gets root on the host. Only the control
      service (nginxions-control with its whitelist of operations, CLAUDE.md "Безопасность") has it.
    severity: ERROR
    languages: [yaml]
    paths:
      include: [deploy/]
    patterns:
      - pattern-regex: '/var/run/docker\.sock\s*:'
      - pattern-not-inside: |
          control:
            ...
    metadata:
      category: security
      cwe: ["CWE-250: Execution with Unnecessary Privileges"]

  - id: nginxions-compose-privileged
    message: >-
      A privileged container, or one in the network or process namespace of the host: the hardening of the stack
      (cap_drop ALL, no-new-privileges, internal networks) is gone for it.
    severity: ERROR
    languages: [yaml]
    paths:
      include: [deploy/]
    pattern-either:
      - pattern: "privileged: true"
      - pattern: "network_mode: host"
      - pattern: "pid: host"
      - pattern: "ipc: host"
    metadata:
      category: security
      cwe: ["CWE-250: Execution with Unnecessary Privileges"]

  - id: nginxions-agent-unsafe-string
    message: >-
      A C string function without a bound in the agent (it parses requests from the internet): an overflow of the
      buffer. Use std::string, snprintf or strncpy with the size of the buffer.
    severity: WARNING
    languages: [c, cpp]
    paths:
      include: [openappsec/]
      exclude: ["*_ut/", "*/test/", "*/tests/"]
    pattern-either:
      - pattern: strcpy(...)
      - pattern: strcat(...)
      - pattern: sprintf(...)
      - pattern: gets(...)
    metadata:
      category: security
      cwe: ["CWE-120: Buffer Copy without Checking Size of Input"]
