[[allowlists]]
description = "the model of the agent (the advanced model): attack keywords and regular expressions of the signatures, not secrets; model/waap.data is where it was first uploaded"
paths = ['''^openappsec/agent/components/security_apps/waap/resources/[^/]+\.data$''', '''^model/waap\.data$''']

[[allowlists]]
description = "the reports of the scan itself (out/): the scan of the files runs after the scan of the history wrote its report there"
paths = ['''^out/''']
