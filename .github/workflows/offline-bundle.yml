name: Offline bundle

on:
  workflow_call:
    inputs:
      ci_image_tag:
        description: Tag of the amd64 images built and uploaded by the calling run
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Tag published for nginxions and nginxions-openappsec
        type: string
        default: develop

permissions:
  contents: read

jobs:
  pack:
    name: Pack offline bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.ci_image_tag != ''
        with:
          name: images
          path: ${{ runner.temp }}/offline-ci-images
      - name: Load the images built for this checkout
        if: inputs.ci_image_tag != ''
        run: docker image load -i "$RUNNER_TEMP/offline-ci-images/images.tar.zst"
      - name: Build Linux amd64 offline bundle
        env:
          NGINXIONS_REGISTRY: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'opensophy' }}
          NGINXIONS_VERSION: ${{ inputs.ci_image_tag || inputs.version }}
          OFFLINE_BUNDLE_USE_LOCAL_IMAGES: ${{ inputs.ci_image_tag != '' && '1' || '0' }}
        run: |
          scripts/offline-bundle.sh nginxions-linux-amd64.tar
          sha256sum nginxions-linux-amd64.tar > nginxions-linux-amd64.tar.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-bundle-candidate
          path: nginxions-linux-amd64.tar*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  acceptance:
    name: Import and run without registry
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: offline-bundle-candidate
          path: ${{ runner.temp }}/offline-candidate
      - name: Unpack and import on a separate Docker runner
        run: |
          candidate="$RUNNER_TEMP/offline-candidate"
          extracted="$RUNNER_TEMP/offline-extracted"
          mkdir "$extracted"
          (
            cd "$candidate"
            sha256sum -c nginxions-linux-amd64.tar.sha256
            tar -xf nginxions-linux-amd64.tar -C "$extracted"
          )
          (cd "$extracted" && sha256sum -c SHA256SUMS)
          # Use the deployment from the archive. Add the test harness from the checkout.
          mv deploy "$RUNNER_TEMP/source-deploy"
          mv "$extracted/deploy" deploy
          cp -R "$RUNNER_TEMP/source-deploy/test" deploy/test
          docker compose -f deploy/compose.yaml -f deploy/test/compose.airgap.yaml pull test-upstream tester
          images=$(docker compose -f deploy/compose.yaml config --images | sort -u)
          while IFS= read -r image; do
            if docker image inspect "$image" > /dev/null 2>&1; then
              echo "::error::Deployment image present before import: $image"
              exit 1
            fi
          done <<< "$images"
          docker image load -i "$extracted/images.tar.gz"
          while IFS= read -r image; do
            docker image inspect "$image" > /dev/null
          done <<< "$images"
          rm "$extracted/images.tar.gz"
      - name: Air-gap acceptance
        env:
          AIRGAP_PRELOADED: "1"
          UI_E2E: "0"
          SMOKE_GROUPS: waf crowdsec
        run: scripts/test-airgap.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nginxions-offline-linux-amd64
          path: ${{ runner.temp }}/offline-candidate/nginxions-linux-amd64.tar*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: offline-acceptance-report
          path: reports/
          if-no-files-found: ignore
