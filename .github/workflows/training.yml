# The regular run prepares the HTTP regression cases from this checkout.
# Manual fitting uses reviewed feature observations and produces an offline candidate.
name: Training

on:
  push:
    branches: [work, 'training/**']
    paths:
      - model/**
      - training/**
      - .github/workflows/training.yml
  pull_request:
    paths:
      - model/**
      - training/**
      - .github/workflows/training.yml
  workflow_dispatch:
    inputs:
      feature_run:
        description: Successful run ID in this repository with a reviewed waap-features artifact (optional)
        type: string
      l2:
        description: L2 regularization for a manual fit
        type: string
        default: '1.0'

permissions:
  contents: read

concurrency:
  group: training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Validate the HTTP coverage fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the model tooling
        run: |
          python3 -m unittest discover -s model
          mkdir -p model-work
      - name: Check verdict fixtures and export ordinary HTTP cases
        shell: bash
        run: |
          python3 model/check_verdict_cases.py model/verdict-cases.txt --requests-out model-work/http-cases.jsonl \
            | tee -a model-work/verdict-cases.md "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waf-http-coverage
          if-no-files-found: error
          path: |
            model-work/http-cases.jsonl
            model-work/verdict-cases.md
            training/HTTP-COVERAGE.md

  fit:
    name: Fit an offline WAF candidate
    if: github.event_name == 'workflow_dispatch' && inputs.feature_run != ''
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    env:
      BASE_MODEL: openappsec/agent/components/security_apps/waap/resources/waap.data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the source run
        env:
          RUN_ID: ${{ inputs.feature_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion' | grep -qx success
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.feature_run }}
          name: waap-features
          path: model-work/input
      - name: Prepare observations and fit
        env:
          L2: ${{ inputs.l2 }}
        run: |
          python3 model/feature_dataset.py --input model-work/input --base "$BASE_MODEL" --out model-work/prepared
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes -r model/requirements.txt
          .venv/bin/python -m unittest discover -s model
          .venv/bin/python model/train.py --samples model-work/prepared/samples.jsonl \
            --dump model-work/prepared/dump --verdicts model-work/prepared/stock.jsonl \
            --base "$BASE_MODEL" --out model-work/candidate --l2="$L2" --name="offline-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waf-model-offline-candidate
          if-no-files-found: error
          path: |
            model-work/candidate/waap.data
            model-work/candidate/model-card.json
            model-work/prepared/coverage.json
