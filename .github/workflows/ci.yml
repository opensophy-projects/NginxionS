# NginxionS CI. Upstream workflows under nginxions/.github are not run (GitHub reads only the root .github).
#
# Images built by NginxionS: nginxions (multi-arch) and nginxions-openappsec (the agent, its shared storage and tuning
# services, nginxions-control; amd64, arm64 is experimental: upstream open-appsec ships amd64 only).
# Publishing to Docker Hub (vars.DOCKERHUB_NAMESPACE, secrets.DOCKERHUB_USERNAME/DOCKERHUB_TOKEN):
#   push to work  -> :develop and :<sha>
#   tag vX.Y.Z    -> :X.Y.Z and :latest
#   other events  -> build and test only (registry login is still checked when secrets exist)
#
# Three depths (docs/DEVSECOPS.md), chosen by the job "level":
#   fast            every push: lint, types, tests, and security.yml (SAST, secrets, SCA, IaC, the workflows)
#   full            also the images: build, closed-network test, image scan, DAST, the security gate before a push.
#                   On work, tags v*, pull requests, by hand (Run workflow, level "full") and on any push whose commit
#                   message holds [full].
#   extended        the full run and the heavy checks: ZAP full active scan, Nuclei with info and intrusive templates,
#                   API fuzzing (Schemathesis), runtime checks of the containers, CodeQL security-and-quality, more
#                   Semgrep rulesets, secrets of every branch, the images published on Docker Hub (every release).
#                   On branches security/** (security-weekly.yml makes one from work every week), on a pull request
#                   with the label security-scan (and on each push to it while the label stays) and by hand (Run
#                   workflow, level "extended", any branch).
# "report" writes the summary of the run and the artifact security-report (the report, readable SBOMs, raw results);
# on a branch security/** it also opens an issue with the report.
name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    # labeled: the label security-scan starts the extended run (the job "level" ignores other labels)
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      level:
        description: "Depth: fast (lint, tests, SAST), full (+ images, DAST), extended (+ heavy security checks)"
        type: choice
        options: [full, extended, fast]
        default: full

permissions:
  contents: read
  pull-requests: read

concurrency:
  # PR runs are authoritative for branches with an open PR; standalone branch pushes still run CI.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'security-scan'
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'opensophy' }}
  PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/work' || startsWith(github.ref, 'refs/tags/v')) && vars.DOCKERHUB_NAMESPACE != '' }}

jobs:
  level:
    name: Depth of the run
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.level.outputs.level }}
      suites: ${{ steps.level.outputs.suites }}
      cpp: ${{ steps.level.outputs.cpp }}
      go: ${{ steps.level.outputs.go }}
      dast: ${{ steps.level.outputs.dast }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # the files of the push or of the pull request, from the API (no deep clone); unknown: everything counts
      - name: changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          : > changed.txt
          case "$EVENT" in
            push) from="$BEFORE"; to="$AFTER" ;;
            pull_request) from="$BASE"; to="$HEAD" ;;
            *) exit 0 ;;
          esac
          # a new branch has no "before"; the compare lists at most 300 files: then the whole run
          case "$from" in ""|0000000000000000000000000000000000000000) exit 0 ;; esac
          gh api "repos/$REPO/compare/$from...$to" --jq '.files[].filename' > changed.txt 2> /dev/null || : > changed.txt
          [ "$(wc -l < changed.txt)" -lt 300 ] || : > changed.txt
          echo "changed: $(wc -l < changed.txt) files"
      - id: level
        env:
          CHANGED: changed.txt
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          INPUT: ${{ inputs.level }}
          MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          # A branch push is superseded by its PR run. Keep standalone branch pushes and work/tag pushes.
          if [ "$EVENT" = push ] && [[ "$REF" == refs/heads/* ]] && [ "$REF" != refs/heads/work ]; then
            open_prs=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq 'length')
            if [ "$open_prs" -gt 0 ]; then
              echo "level=none" >> "$GITHUB_OUTPUT"
              echo 'suites=[]' >> "$GITHUB_OUTPUT"
              echo "cpp=false" >> "$GITHUB_OUTPUT"
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "dast=false" >> "$GITHUB_OUTPUT"
              echo "### CI skipped: this commit is already validated by its pull request." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          node scripts/ci-level.mjs

  checks-backend:
    name: Backend (Biome, unit + PostgreSQL tests)
    needs: level
    if: needs.level.outputs.level != 'none'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_USER: nginxions
          POSTGRES_PASSWORD: nginxions-tests
          POSTGRES_DB: nginxions
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U nginxions" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: nginxions/backend/pnpm-lock.yaml
      - name: backend
        working-directory: nginxions/backend
        env:
          DB_POSTGRES_HOST: 127.0.0.1
          DB_POSTGRES_PORT: "5432"
          DB_POSTGRES_USER: nginxions
          DB_POSTGRES_PASSWORD: nginxions-tests
          DB_POSTGRES_NAME: nginxions
          NGINXIONS_TEST_POSTGRES: "1"
        run: |
          pnpm install --frozen-lockfile
          # import ordering (biome assist) is not enforced: upstream code does not follow it
          pnpm biome ci . --assist-enabled=false
          # unit tests of NginxionS modules (upstream has none); the SQL ones on the postgres service
          node --test 'nginxions/**/*.test.js'

  checks-frontend:
    name: Frontend (Biome, locales, TypeScript, Vitest)
    needs: level
    if: needs.level.outputs.level != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: nginxions/frontend/pnpm-lock.yaml
      - name: frontend
        working-directory: nginxions/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm biome ci . --assist-enabled=false
          node check-locales.cjs
          node ../../scripts/check-i18n.mjs
          pnpm formatjs compile-folder src/locale/src src/locale/lang
          pnpm tsc --noEmit
          pnpm vitest run

  checks-agent:
    name: Agent (Go, Snort converter, Lua)
    needs: level
    if: needs.level.outputs.level != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Go services of the agent (vet, tests)
        # shared storage and tuning (built into nginxions-openappsec) and smartsync, in the Go image of its Dockerfile
        run: scripts/test-go.sh
      - name: converter of Snort signatures of the agent (JavaScript = Python of upstream)
        run: node --test openappsec/agent/nodes/http_transaction_handler/package/snort_to_ips_local.test.mjs
      - name: Lua modules in nginx (File Security), with LuaJIT
        run: |
          sudo apt-get install -y -qq luajit > /dev/null
          scripts/test-lua.sh

  checks-repository:
    name: Repository (scripts, model, shell, Compose, versions)
    needs: level
    if: needs.level.outputs.level != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: scripts of CI (audit of the logs, depth of the run, report of smoke)
        run: node --test scripts/*.test.mjs
      - name: file tree
        # every file of the code of NginxionS has a line in CODE_OF_CONDUCT.md
        run: node scripts/check-tree.mjs
      - name: WAF model tooling (model/, docs/MODEL.md)
        # the training cycle itself (numpy, scipy) is tested in training.yml; here the formats and the data
        run: python3 -m unittest discover -s model
      - name: shell scripts
        run: |
          shellcheck -x -S warning scripts/*.sh deploy/*/*.sh deploy/openappsec/*/*.sh nginxions/crowdsec-seed/*.sh
          shellcheck -S warning -s sh deploy/test/smoke/*.sh
      - name: compose files
        run: |
          docker compose -f deploy/compose.yaml config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml config -q
          docker compose -f deploy/compose.yaml -f deploy/test/compose.airgap.yaml config -q
          NGINXIONS_FEATURES_DIR=/tmp/features docker compose -f deploy/compose.yaml -f deploy/test/compose.training.yaml config -q
          if grep -nE 'image: .*:latest|:-latest' deploy/*.yaml deploy/test/*.yaml; then
            echo "::error::unpinned image version"; exit 1
          fi
      - name: agent sources build with newer Boost (issue 113)
        run: |
          # boost::uuids::entropy_error is gone from Boost 1.86+: the agent catches std::exception instead. A subtree
          # pull of open-appsec brings the old catches back; this fails before the image build does.
          if grep -rn --include='*.cc' --include='*.h' 'catch *( *const boost::uuids::entropy_error' openappsec/; then
            echo "::error::catch std::exception, not boost::uuids::entropy_error (removed from Boost 1.86+)"; exit 1
          fi
      - name: version consistency
        run: |
          env_pg=$(sed -n 's/^POSTGRES_VERSION=//p' deploy/.env)
          for f in .github/workflows/ci.yml .github/workflows/security.yml; do
            while read -r tag; do
              [ "$tag" = "$env_pg" ] || { echo "::error file=$f::postgres:$tag != deploy/.env $env_pg"; exit 1; }
            done < <(sed -n 's|.*image: docker.io/library/postgres:\([^@ ]*\)@sha256:.*|\1|p' "$f")
          done
          env_cs=$(sed -n 's/^CROWDSEC_VERSION=//p' deploy/.env)
          for f in nginxions/Dockerfile deploy/dev/Dockerfile; do
            from_cs=$(sed -n 's|^FROM docker.io/crowdsecurity/crowdsec:\([^@ ]*\)@sha256:.*|\1|p' "$f")
            [ "$env_cs" = "$from_cs" ] || { echo "::error file=$f::FROM crowdsec:$from_cs != deploy/.env $env_cs"; exit 1; }
          done
          . deploy/openappsec/sources.env
          for ref in "$OPENAPPSEC_REF" "$ATTACHMENT_REF" "$SHARED_FILES_REF" "$TUNING_REF" "$SMARTSYNC_REF" "$CROWDSEC_HUB_REF"; do
            echo "$ref" | grep -qE '^[0-9a-f]{40}$' || { echo "::error file=deploy/openappsec/sources.env::not a full commit: $ref"; exit 1; }
          done
          ips_ref=$(jq -r '.source.ref' openappsec/agent/nginxions/ips-protections.json)
          [ "$ips_ref" = "$CROWDSEC_HUB_REF" ] || { echo "::error file=deploy/openappsec/sources.env::CROWDSEC_HUB_REF $CROWDSEC_HUB_REF != the hub of ips-protections.json $ips_ref"; exit 1; }
          for f in $(jq -r '.packageRules[].matchFileNames[]? | select(test("[*?]") | not)' renovate.json); do
            [ -e "$f" ] || { echo "::error file=renovate.json::matchFileNames: $f does not exist"; exit 1; }
          done
      - name: registry credentials
        if: vars.DOCKERHUB_NAMESPACE != '' && github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  contract:
    name: Policy contract with the agent (published develop)
    needs: level
    if: needs.level.outputs.level != 'none'
    runs-on: ubuntu-latest
    # in a full run the contract with the agent of the build (job images) decides: the published develop may lack an
    # agent change this branch relies on (it is published after this run), then this job warns and stays green
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest
      - name: the policies of this commit, given to the agent of the published develop
        # the agent of this commit is checked the same way in "images", after its build
        env:
          NGINXIONS_REGISTRY: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'opensophy' }}
          NGINXIONS_VERSION: develop
          DECIDES: ${{ needs.level.outputs.level == 'fast' }}
        run: |
          (cd nginxions/backend && pnpm install --frozen-lockfile > /dev/null)
          if scripts/test-policy-contract.sh; then exit 0; fi
          [ "$DECIDES" = true ] && exit 1
          echo "::warning title=Policy contract::the agent of the published develop refuses a policy of this commit; the contract with the agent of this build (job images) decides"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: policy-contract
          path: reports/policy-contract/
          if-no-files-found: ignore

  security:
    name: Security
    needs: level
    if: needs.level.outputs.level != 'none'
    uses: ./.github/workflows/security.yml
    with:
      level: ${{ needs.level.outputs.level }}
      # incremental: CodeQL of C++ and Go only when their code changed (the extended and weekly runs: always)
      cpp: ${{ needs.level.outputs.cpp == 'true' }}
      go: ${{ needs.level.outputs.go == 'true' }}
    permissions:
      contents: read
      security-events: write
      actions: read

  images:
    name: "Images (amd64): build, policy contract, image scan"
    needs: [level]
    # the full and the extended run (see the head of this file); other branches stop after the fast checks
    if: needs.level.outputs.level == 'full' || needs.level.outputs.level == 'extended'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the policy contract runs modules of the backend
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest
      - name: versions
        run: |
          v="$(git rev-parse --short HEAD)"
          {
            echo "VERSION=$v"
            echo "CROWDSEC_VERSION=$(sed -n 's/^CROWDSEC_VERSION=//p' deploy/.env)"
            # the day of the build: the "apk upgrade" layers of the images are rebuilt daily (Dockerfiles, APK_REFRESH)
            echo "APK_REFRESH=$(date -u +%F)"
          } >> "$GITHUB_ENV"
          for f in nginxions/frontend/package.json nginxions/backend/package.json; do
            jq --arg v "$v" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: build nginxions
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: nginxions
          build-contexts: attachment=openappsec/attachment
          load: true
          tags: docker.io/${{ env.NAMESPACE }}/nginxions:${{ env.VERSION }}
          cache-from: type=gha,scope=nginxions-amd64
          cache-to: type=gha,mode=max,scope=nginxions-amd64
          build-args: |
            CROWDSEC_VERSION=${{ env.CROWDSEC_VERSION }}
            FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full
            APK_REFRESH=${{ env.APK_REFRESH }}
      - name: build nginxions-openappsec
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/openappsec
          build-contexts: |
            openappsec=openappsec
            control=nginxions/backend/nginxions/control
          load: true
          tags: docker.io/${{ env.NAMESPACE }}/nginxions-openappsec:${{ env.VERSION }}
          cache-from: type=gha,scope=openappsec-amd64
          cache-to: type=gha,mode=max,scope=openappsec-amd64
          build-args: |
            APK_REFRESH=${{ env.APK_REFRESH }}
          # smartsync (central learning) is not built: it needs a Fog token the agent lacks in local-only
          # mode. NginxionS learns locally; see docs/adr/0011-learning.md.
      - name: policy contract with the agent of this build
        env:
          NGINXIONS_REGISTRY: docker.io/${{ env.NAMESPACE }}
          NGINXIONS_VERSION: ${{ env.VERSION }}
          OUT: reports/policy-contract
        run: |
          (cd nginxions/backend && pnpm install --frozen-lockfile > /dev/null)
          scripts/test-policy-contract.sh
      - name: image scan (Trivy, Syft SBOM, Grype, Dockle)
        env:
          NGINXIONS_REGISTRY: docker.io/${{ env.NAMESPACE }}
          NGINXIONS_VERSION: ${{ env.VERSION }}
          OUT: reports/images
        run: scripts/scan-images.sh
      # accepted risks of the images leave the SARIF of code scanning (docs/DEVSECOPS.md); the report keeps them
      - name: accepted risks out of the SARIF of the images
        if: always()
        run: |
          mkdir -p upload
          for img in nginxions nginxions-openappsec; do
            f="reports/images/trivy-$img.sarif"
            [ -f "$f" ] && node scripts/sarif-accepted.mjs "trivy-$img" "$f" "upload/trivy-$img.sarif"
          done
          true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('upload/trivy-nginxions.sarif') != ''
        with:
          sarif_file: upload/trivy-nginxions.sarif
          category: trivy-nginxions
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('upload/trivy-nginxions-openappsec.sarif') != ''
        with:
          sarif_file: upload/trivy-nginxions-openappsec.sarif
          category: trivy-nginxions-openappsec
      # the categories of the images before the rename (trivy-npmos*) get no analysis any more, so their alerts would
      # stay open for ever: an empty analysis of the same tool closes them (docs/DEVSECOPS.md, retired categories)
      - name: empty SARIF for the retired categories of the images
        if: always()
        run: |
          mkdir -p upload
          echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Trivy","informationUri":"https://github.com/aquasecurity/trivy","rules":[]}},"results":[]}]}' \
            > upload/retired.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('upload/retired.sarif') != ''
        with:
          sarif_file: upload/retired.sarif
          category: trivy-npmos
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('upload/retired.sarif') != ''
        with:
          sarif_file: upload/retired.sarif
          category: trivy-npmos-openappsec
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-images
          path: reports/
          if-no-files-found: ignore
      - name: the images for the tests of the stack
        run: |
          docker save "docker.io/$NAMESPACE/nginxions:$VERSION" "docker.io/$NAMESPACE/nginxions-openappsec:$VERSION" \
            | zstd -T0 -3 -q -o images.tar.zst
          ls -lh images.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images.tar.zst
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-policy-contract
          path: reports/policy-contract/
          if-no-files-found: ignore

  stack:
    name: Stack test (${{ matrix.suite }})
    needs: [level, images]
    # every test of the stack on a machine of its own, in parallel (scripts/ci-stack.sh); a failed one stops no other
    strategy:
      fail-fast: false
      matrix:
        # all of them, or those of the message ([smoke:waf], [dast]...: scripts/ci-level.mjs)
        suite: ${{ fromJSON(needs.level.outputs.suites) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.level.outputs.level == 'extended' && 160 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - name: images of the build
        run: |
          echo "VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          zstd -d -q -c images.tar.zst | docker load
          rm images.tar.zst
      - name: ${{ matrix.suite }}
        env:
          DAST_LEVEL: ${{ needs.level.outputs.level }}
          NGINXIONS_REGISTRY: docker.io/${{ env.NAMESPACE }}
          FROM_REGISTRY: docker.io/${{ env.NAMESPACE }}
          FROM_VERSION: develop
          SUITE: ${{ matrix.suite }}
        run: NGINXIONS_VERSION="$VERSION" scripts/ci-stack.sh "$SUITE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # DAST is a security check: its results go into the security report (artifacts security-*)
          name: ${{ matrix.suite == 'dast' && 'security-dast' || format('tests-{0}', matrix.suite) }}
          path: reports/
          if-no-files-found: ignore

  publish:
    name: Security gate${{ github.event_name == 'push' && ' + publish' || '' }}
    needs: [level, checks-backend, checks-frontend, checks-agent, checks-repository, contract, security, images, stack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # keyless signatures (cosign) and the attestations of GitHub (SLSA provenance, SBOM) of the published images
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: security-*
          path: reports
          merge-multiple: true
      - name: security gate (nothing is pushed with a blocking finding)
        env:
          # DAST is expected when it ran (a run of chosen tests of the stack may leave it out)
          EXPECT: images${{ needs.level.outputs.dast == 'true' && ',dast' || '' }}
        run: node scripts/security-report.mjs --in reports --scope images,dast --expect "$EXPECT"
      # the coverage of the code: unit tests (artifact security-quality) and what the backend ran in the tests of the
      # stack (artifacts tests-*), with its ratchet .github/coverage-baseline.json (scripts/coverage-report.mjs)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tests-*
          path: reports/tests
      # the lines this branch adds to the backend, from the comparison of GitHub with work (no deep clone): at least
      # 80 % of them must run in a test; on work itself there is nothing to compare
      - name: what this branch changes against work
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: gh api "repos/$REPO/compare/work...$SHA" > compare.json 2> /dev/null || echo '{}' > compare.json
      - name: coverage of the code by the tests (it may not fall)
        run: node scripts/coverage-report.mjs --in reports --diff compare.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.PUBLISH == 'true'
        with:
          name: images
      - name: images of the build
        if: env.PUBLISH == 'true'
        run: |
          echo "VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          zstd -d -q -c images.tar.zst | docker load
      - name: docker.io login
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push
        if: env.PUBLISH == 'true'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tags="${GITHUB_REF#refs/tags/v} latest" ;;
            *) tags="develop" ;;
          esac
          for img in nginxions nginxions-openappsec; do
            src="docker.io/$NAMESPACE/$img:$VERSION"
            # nginxions gets a multi-arch manifest in the manifest job; push its amd64 build under an arch tag
            if [ "$img" = nginxions ]; then
              for t in $tags; do docker tag "$src" "docker.io/$NAMESPACE/$img:$t-amd64"; docker push "docker.io/$NAMESPACE/$img:$t-amd64"; done
            else
              docker push "$src"
              for t in $tags; do docker tag "$src" "docker.io/$NAMESPACE/$img:$t"; docker push "docker.io/$NAMESPACE/$img:$t"; done
            fi
          done

      # what was published can be checked: built here, from this commit, not replaced (docs/DEVSECOPS.md, "Подпись")
      #   gh attestation verify oci://docker.io/<ns>/<image>:<tag> --repo <owner>/<repo>
      #   cosign verify docker.io/<ns>/<image>:<tag> --certificate-identity-regexp 'https://github.com/<owner>/<repo>/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: digests of the published images
        if: env.PUBLISH == 'true'
        id: digests
        run: |
          for img in nginxions nginxions-openappsec; do
            digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "docker.io/$NAMESPACE/$img:$VERSION" \
              | grep -m1 "^docker.io/$NAMESPACE/$img@" | cut -d@ -f2)
            [ -n "$digest" ] || digest=$(docker inspect --format '{{index .RepoDigests 0}}' "docker.io/$NAMESPACE/$img:$VERSION" | cut -d@ -f2)
            echo "${img//-/_}=$digest" >> "$GITHUB_OUTPUT"
            echo "$img@$digest"
          done
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.PUBLISH == 'true'
      - name: sign (cosign, keyless)
        if: env.PUBLISH == 'true'
        env:
          NGINXIONS_DIGEST: ${{ steps.digests.outputs.nginxions }}
          APPSEC_DIGEST: ${{ steps.digests.outputs.nginxions_openappsec }}
        run: |
          cosign sign --yes "docker.io/$NAMESPACE/nginxions@$NGINXIONS_DIGEST"
          cosign sign --yes "docker.io/$NAMESPACE/nginxions-openappsec@$APPSEC_DIGEST"
      - name: provenance of nginxions (SLSA)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ env.NAMESPACE }}/nginxions
          subject-digest: ${{ steps.digests.outputs.nginxions }}
          push-to-registry: true
      - name: provenance of nginxions-openappsec (SLSA)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ env.NAMESPACE }}/nginxions-openappsec
          subject-digest: ${{ steps.digests.outputs.nginxions_openappsec }}
          push-to-registry: true
      - name: SBOM of nginxions as an attestation
        if: env.PUBLISH == 'true' && hashFiles('reports/images/sbom-nginxions.spdx.json') != ''
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: docker.io/${{ env.NAMESPACE }}/nginxions
          subject-digest: ${{ steps.digests.outputs.nginxions }}
          sbom-path: reports/images/sbom-nginxions.spdx.json
          push-to-registry: true
      - name: SBOM of nginxions-openappsec as an attestation
        if: env.PUBLISH == 'true' && hashFiles('reports/images/sbom-nginxions-openappsec.spdx.json') != ''
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: docker.io/${{ env.NAMESPACE }}/nginxions-openappsec
          subject-digest: ${{ steps.digests.outputs.nginxions_openappsec }}
          sbom-path: reports/images/sbom-nginxions-openappsec.spdx.json
          push-to-registry: true
  nginxions-arm64:
    name: nginxions image (arm64)
    needs: [level, checks]
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/work' || startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/security/') &&
      needs.level.outputs.level != 'fast'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versions
        run: |
          v="$(git rev-parse --short HEAD)"
          case "$GITHUB_REF" in
            refs/tags/v*) tags="${GITHUB_REF#refs/tags/v} latest" ;;
            *) tags="develop" ;;
          esac
          {
            echo "VERSION=$v"
            echo "CROWDSEC_VERSION=$(sed -n 's/^CROWDSEC_VERSION=//p' deploy/.env)"
            echo "TAGS=$tags"
            echo "APK_REFRESH=$(date -u +%F)"
          } >> "$GITHUB_ENV"
          for f in nginxions/frontend/package.json nginxions/backend/package.json; do
            jq --arg v "$v" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: docker.io login
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build (and push arch tags)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: nginxions
          build-contexts: attachment=openappsec/attachment
          push: ${{ env.PUBLISH == 'true' }}
          tags: docker.io/${{ env.NAMESPACE }}/nginxions:${{ env.VERSION }}-arm64
          cache-from: type=gha,scope=nginxions-arm64
          cache-to: type=gha,mode=max,scope=nginxions-arm64
          build-args: |
            CROWDSEC_VERSION=${{ env.CROWDSEC_VERSION }}
            FLAGS=-mbranch-protection=standard
            APK_REFRESH=${{ env.APK_REFRESH }}
      - name: arch tags
        if: env.PUBLISH == 'true'
        run: |
          for t in $TAGS; do
            docker buildx imagetools create -t "docker.io/$NAMESPACE/nginxions:$t-arm64" "docker.io/$NAMESPACE/nginxions:$VERSION-arm64"
          done

  nginxions-manifest:
    name: nginxions multi-arch manifest
    needs: [publish, nginxions-arm64]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/work' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: docker.io login
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: manifest
        if: env.PUBLISH == 'true'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tags="${GITHUB_REF#refs/tags/v} latest" ;;
            *) tags="develop" ;;
          esac
          for t in $tags; do
            docker buildx imagetools create -t "docker.io/$NAMESPACE/nginxions:$t" \
              "docker.io/$NAMESPACE/nginxions:$t-amd64" "docker.io/$NAMESPACE/nginxions:$t-arm64"
          done
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.PUBLISH == 'true'
      - name: sign the multi-arch manifest (cosign, keyless)
        if: env.PUBLISH == 'true'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) t="${GITHUB_REF#refs/tags/v}" ;;
            *) t="develop" ;;
          esac
          digest=$(docker buildx imagetools inspect "docker.io/$NAMESPACE/nginxions:$t" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "docker.io/$NAMESPACE/nginxions@$digest"

  appsec-arm64:
    name: nginxions-openappsec image (arm64, experimental)
    needs: [level, checks]
    if: >-
      github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/security/') &&
      needs.level.outputs.level != 'fast'
    continue-on-error: true
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: day of the build (APK_REFRESH, see the job images)
        run: echo "APK_REFRESH=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: build nginxions-openappsec (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/openappsec
          build-contexts: |
            openappsec=openappsec
            control=nginxions/backend/nginxions/control
          cache-from: type=gha,scope=openappsec-arm64
          cache-to: type=gha,mode=max,scope=openappsec-arm64
          build-args: |
            APK_REFRESH=${{ env.APK_REFRESH }}

  report:
    name: Security report
    needs: [level, checks, security, images, stack]
    if: always() && needs.level.outputs.level != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the issue of a weekly branch security/<date>
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: security-*
          path: reports
          merge-multiple: true
      - name: summary
        env:
          # the images and DAST are expected only when the images were built, the heavy checks only in the extended run
          EXPECT: >-
            ${{ needs.images.result == 'skipped' && 'source' || (needs.level.outputs.dast == 'true' && 'source,images,dast' ||
            'source,images') }}${{
            needs.level.outputs.level == 'extended' && (needs.images.result == 'skipped' && ',published' ||
            ',published,extended') || '' }}
        run: node scripts/security-report.mjs --in reports --out security-report --summary "$GITHUB_STEP_SUMMARY" --expect "$EXPECT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-report
          path: security-report/
      - name: issue with the report (weekly branch security/<date>)
        if: always() && startsWith(github.ref, 'refs/heads/security/') && hashFiles('security-report/security-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if grep -q 'Итог: ✅' security-report/security-report.md; then mark="✅"; else mark="❌"; fi
          {
            echo "Еженедельная проверка ветки \`$REF_NAME\` (сделана из \`work\`). Прогон: $RUN_URL"
            echo "Полный отчёт и SBOM — артефакт **security-report** прогона."
            echo
            head -c 60000 security-report/security-report.md
          } > issue.md
          gh label create security --repo "$REPO" --color B60205 --description "Security reports" --force > /dev/null
          gh issue create --repo "$REPO" --label security --title "$mark Отчёт безопасности ${REF_NAME#security/}" --body-file issue.md
