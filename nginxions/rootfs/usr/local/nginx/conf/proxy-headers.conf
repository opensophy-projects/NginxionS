# ip headers
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;

# general headers
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host$is_request_port$request_port;

# websockets
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# 0rtt header
proxy_set_header Early-Data $ssl_early_data;

# NginxionS: the certificate of a node on its channel (conf.d/nginxions-cluster.conf); empty, and so never sent,
# everywhere else: a client cannot set it
proxy_set_header X-NginxionS-Node-Cert $nginxions_node_cert;
