# NginxionS: the certificate a node showed on its channel (server nginxions-cluster of npmplus.conf, docs/adr/0012-nodes.md
# 5a). proxy-headers.conf passes it to the backend as X-NginxionS-Node-Cert; on any other name it is empty, so the
# header never reaches the backend from a client.
# Pass only the URL-escaped PEM alphabet. The named capture excludes raw CR and LF from the upstream header.
map "$ssl_server_name:$ssl_client_escaped_cert" $nginxions_node_cert {
  ~^nginxions-cluster:(?<nginxions_escaped_node_cert>[-A-Za-z0-9._~%+=/]+)$ $nginxions_escaped_node_cert;
  default "";
}
