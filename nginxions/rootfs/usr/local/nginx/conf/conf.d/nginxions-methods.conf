# NginxionS: the debugging methods TRACK and DEBUG are refused with 405 on every host and on the interface. They were
# passed on to the server of a site, and a server that echoes a request (as TRACE does) sent back the headers the
# proxy adds (DAST, ZAP 40025 Proxy Disclosure, Cross Site Tracing). nginx refuses TRACE itself; no browser, API or
# client of a site sends these methods.
rewrite_by_lua_block {
  local method = ngx.req.get_method()
  if method == "TRACK" or method == "DEBUG" or method == "TRACE" then
    return ngx.exit(ngx.HTTP_NOT_ALLOWED)
  end
}
